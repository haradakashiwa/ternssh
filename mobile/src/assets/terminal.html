<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/css/xterm.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1e1e1e;
    }
    #terminal {
      width: 100%;
      height: 100%;
    }
    .xterm {
      padding: 8px;
    }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      text-align: center;
    }
    #status.error {
      color: #f44336;
    }
    #status.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <div id="status">Connecting...</div>
  
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    let terminal = null;
    let fitAddon = null;
    let ws = null;
    let connected = false;

    function showStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = isError ? 'error' : '';
    }

    function hideStatus() {
      statusEl.className = 'hidden';
    }

    function sendToRN(type, data) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type, ...data }));
      }
    }

    function initTerminal() {
      terminal = new Terminal({
        cursorBlink: true,
        convertEol: true,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
        fontSize: 14,
        theme: {
          background: '#1e1e1e',
          foreground: '#d4d4d4',
          cursor: '#d4d4d4',
          cursorAccent: '#1e1e1e',
          selectionBackground: '#264f78',
          black: '#000000',
          red: '#cd3131',
          green: '#0dbc79',
          yellow: '#e5e510',
          blue: '#2472c8',
          magenta: '#bc3fbc',
          cyan: '#11a8cd',
          white: '#e5e5e5',
          brightBlack: '#666666',
          brightRed: '#f14c4c',
          brightGreen: '#23d18b',
          brightYellow: '#f5f543',
          brightBlue: '#3b8eea',
          brightMagenta: '#d670d6',
          brightCyan: '#29b8db',
          brightWhite: '#e5e5e5',
        },
      });

      fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(document.getElementById('terminal'));
      fitAddon.fit();

      terminal.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(data);
        }
      });

      terminal.onResize(({ cols, rows }) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols, rows }));
        }
      });

      window.addEventListener('resize', () => {
        if (fitAddon) fitAddon.fit();
      });

      sendToRN('ready');
    }

    function connect(wsUrl, authHeaders) {
      showStatus('Connecting...');
      
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        if (fitAddon) {
          fitAddon.fit();
          ws.send(JSON.stringify({
            type: 'resize',
            cols: terminal.cols,
            rows: terminal.rows,
          }));
        }
      };

      ws.onmessage = (event) => {
        let data;
        if (event.data instanceof ArrayBuffer) {
          data = new TextDecoder().decode(event.data);
        } else {
          data = event.data;
        }

        // Handle control messages
        if (data.startsWith('{')) {
          try {
            const parsed = JSON.parse(data);
            if (parsed.type === 'error') {
              showStatus(parsed.message || 'Connection error', true);
              sendToRN('error', { message: parsed.message });
              return;
            }
            if (parsed.type === 'status' && 
                (parsed.message?.includes('Shell ready') || 
                 parsed.message?.includes('Shell 已就绪') ||
                 parsed.message?.includes('authenticated'))) {
              connected = true;
              hideStatus();
              terminal.reset();
              if (fitAddon) fitAddon.fit();
              sendToRN('connected');
              return;
            }
            // Ignore other control messages
            if (parsed.type) return;
          } catch {
            // Not JSON, continue to write
          }
        }

        terminal.write(data);
      };

      ws.onclose = () => {
        if (!connected) {
          showStatus('Connection closed', true);
        } else {
          terminal.writeln('\r\n\x1b[33mConnection closed\x1b[0m');
        }
        sendToRN('disconnected');
      };

      ws.onerror = () => {
        showStatus('Connection failed', true);
        sendToRN('error', { message: 'WebSocket connection failed' });
      };
    }

    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    function handleMessage(event) {
      try {
        const msg = JSON.parse(event.data);
        switch (msg.type) {
          case 'connect':
            connect(msg.wsUrl, msg.authHeaders || {});
            break;
          case 'disconnect':
            disconnect();
            break;
          case 'resize':
            if (fitAddon) fitAddon.fit();
            break;
        }
      } catch (e) {
        console.error('Error handling message:', e);
      }
    }

    // Listen for messages from React Native
    document.addEventListener('message', handleMessage);
    window.addEventListener('message', handleMessage);

    // Initialize terminal
    initTerminal();
  </script>
</body>
</html>
